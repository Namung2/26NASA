# 지역 설정 — 번들을 만들 때의 입력 (docs/spec/S3a §1, S5 §8). 당일(2026-11-14) 작성.
#
# 좌표 약속
#   로컬 좌표: 미터, (동쪽 x, 북쪽 y). 원점 (0, 0) = 활동 구역의 북서쪽 모서리 → 구역 안의 y는 0 ~ -(한 변)이다.
#   로컬 투영: 구역 중심을 기준 위도·경도로 한 정거원통 (Mars 2000 구, 반지름 3,396,190 m).
#   받은 고도 자료는 기준 위도가 0°라 동서가 5 % 늘어나 있다 → 반드시 이 투영으로 다시 놓는다 (pipeline/dtm.py).
site: jezero_west
bundle_version: 1

aoi:
  center_lon_e: 77.42               # 착륙 지점과 서쪽 삼각주 사이
  center_lat_n: 18.46
  half_size_m: 2500                 # 5 km 정사각형. 고도 자료가 100 % 있는 구역 (2026-11-14 확인)

levels_m: {field: 5, rover: 2}      # 기기용 / 로버용 격자

products:                           # 받은 원천 자료. 받는 곳과 내용은 docs/REFERENCE_BingoTime.md §1.2, §6.1
  dtm:
    path: "자료/m2020_trn_hirise/JEZ_hirise_soc_006_DTM_MOLAtopography_DeltaGeoid_1m_Eqc_latTs0_lon0_blend40.tif"
    source: "USGS Astrogeology"
    product_id: "Mars 2020 Terrain Relative Navigation HiRISE DTM Mosaic (DOI 10.5066/P9REJ9JN)"
    resolution_m: 1.0
    license: "USGS 공개 자료(퍼블릭 도메인)"
  # 기준 그림: 고도 자료와 한 벌로 나온 CTX 정사 모자이크. 다른 바탕 위에 만들어진 자료(지질 단위)를 여기에 맞춘다
  reference_image:
    path: "자료/m2020_trn_ctx/JEZ_ctx_B_soc_008_orthoMosaic_6m_Eqc_latTs0_lon0.tif"
    source: "USGS Astrogeology"
    product_id: "Mars 2020 TRN CTX Orthomosaic (DOI 10.5066/P9GV1ND3)"
    resolution_m: 6.0
    license: "USGS 공개 자료(퍼블릭 도메인)"
  minerals:
    path: "자료/mineral_parente2021/jezeroFinal.tif"
    source: "Parente, Itoh, Saranathan 2021 (Zenodo)"
    product_id: "Jezero crater mineral map (DOI 10.5281/zenodo.5575824)"
    resolution_m: 36.0
    license: "CC BY 4.0"
    # 광물 지도의 위치를 확인하는 데 쓰는 원자료: 이 지도를 만든 CRISM 장면의 요약 파라미터(지수) 그림.
    # 번들을 만들 때마다 지도가 기준에서 얼마나 어긋났는지 재서 메타의 registration.minerals에 적는다 (pipeline/register.py).
    # 2026-11-14에 두 번 잰 값: (동 -8 m, 북 +7 m), (동 -12 m, 북 +17 m) — 한 칸(36 m)의 절반 안팎이고 측정이 10 m쯤 흔들린다.
    # 잰 값이 칸의 절반과 측정 흩어짐의 2배를 모두 넘을 때만 지도를 옮긴다(지금은 옮기지 않는다).
    index_image: "자료/crism_mtrdr_hrl000040ff/hrl000040ff_07_sr183j_mtr3.img"   # NASA PDS Geosciences, CRISM MTRDR HRL000040FF (SR), 82 MB
  geology:
    path: "자료/sim3464_database/sim3464_JezeroNili_FINAL/Geodatabase/Nili.gdb"
    layer: GeoUnits_v1
    source: "USGS (Sun & Stack 2020)"
    product_id: "SIM 3464 Geologic Map of Jezero Crater and the Nili Planum Region (DOI 10.3133/sim3464)"
    resolution_m: null              # 1:75,000 벡터
    license: "퍼블릭 도메인"
    # 지질 단위 지도는 고도 자료와 100 m쯤 어긋나 있다 — 지도의 선이 다른 바탕 그림(아래 base_image) 위에 그려졌기 때문이다.
    # 번들을 만들 때마다 그 바탕 그림을 기준 그림(reference_image)에 맞춰 보고, 구한 변환으로 폴리곤을 옮긴다.
    # 손으로 적는 이동량은 없다. 방법·결과·남은 오차는 pipeline/register.py 머리말과 번들 메타의 registration에 있다.
    base_image: "자료/sim3464_database/sim3464_JezeroNili_FINAL/Rasters/Caltech_CTX_mosaic_feb2018/Nili_CTX_Mosaic_Beta01_Feb2018_MTM.tif"

sun:
  # 태양 표를 만들 날. 그날 그 자리의 태양 고도·방위를 NASA GISS Mars24 계산 절차로 낸다 (pipeline/suntable.py).
  date_utc: "2021-02-19"            # Perseverance 착륙 다음 날. 임의로 고른 날이다 — 시나리오를 정하면 바꾼다
  eva_start_lmst: "08:30"           # EVA 경과 0초에 해당하는 지방 평균 태양시. 태양 표의 t_eva_s 열이 이 시각 기준이다

# 주차점과 지점: config/placement.yaml이 있으면 그것을 쓴다(scripts/place_scenario.py가 배치 규칙으로 만든 것).
# 아래는 그 파일이 없을 때 쓰는 손 배치다.
rover_parks:                        # 로버 주차점. 링크 지도를 이 자리에서 굽는다
  - {id: park1, lon_e: 77.451, lat_n: 18.445, note: "Perseverance 착륙 지점(Octavia E. Butler Landing)"}

pois:
  - {id: P1, name: "P1", xy: [3400, -2900], kind: feature}
  - {id: P2, name: "P2", xy: [1600, -2300], kind: sample}
  - {id: P3, name: "P3", xy: [2200, -3700], kind: feature}
