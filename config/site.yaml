# 지역 설정 — 번들을 만들 때의 입력 (docs/spec/S3a §1, S5 §8). 당일(2026-11-14) 작성.
#
# 좌표 약속
#   로컬 좌표: 미터, (동쪽 x, 북쪽 y). 원점 (0, 0) = 활동 구역의 북서쪽 모서리 → 구역 안의 y는 0 ~ -(한 변)이다.
#   로컬 투영: 구역 중심을 기준 위도·경도로 한 정거원통 (Mars 2000 구, 반지름 3,396,190 m).
#   받은 고도 자료는 기준 위도가 0°라 동서가 5 % 늘어나 있다 → 반드시 이 투영으로 다시 놓는다 (pipeline/dtm.py).
site: jezero_west
bundle_version: 1

aoi:
  center_lon_e: 77.42               # 착륙 지점과 서쪽 삼각주 사이
  center_lat_n: 18.46
  half_size_m: 2500                 # 5 km 정사각형. 고도 자료가 100 % 있는 구역 (2026-11-14 확인)

levels_m: {field: 5, rover: 2}      # 기기용 / 로버용 격자

products:                           # 받은 원천 자료. 받는 곳과 내용은 docs/REFERENCE_BingoTime.md §1.2, §6.1
  dtm:
    path: "자료/m2020_trn_hirise/JEZ_hirise_soc_006_DTM_MOLAtopography_DeltaGeoid_1m_Eqc_latTs0_lon0_blend40.tif"
    source: "USGS Astrogeology"
    product_id: "Mars 2020 Terrain Relative Navigation HiRISE DTM Mosaic (DOI 10.5066/P9REJ9JN)"
    resolution_m: 1.0
    license: "USGS 공개 자료(퍼블릭 도메인)"
  # 기준 그림: 고도 자료와 한 벌로 나온 CTX 정사 모자이크. 다른 바탕 위에 만들어진 자료(지질 단위)를 여기에 맞춘다
  reference_image:
    path: "자료/m2020_trn_ctx/JEZ_ctx_B_soc_008_orthoMosaic_6m_Eqc_latTs0_lon0.tif"
    source: "USGS Astrogeology"
    product_id: "Mars 2020 TRN CTX Orthomosaic (DOI 10.5066/P9GV1ND3)"
    resolution_m: 6.0
    license: "USGS 공개 자료(퍼블릭 도메인)"
  minerals:
    path: "자료/mineral_parente2021/jezeroFinal.tif"
    source: "Parente, Itoh, Saranathan 2021 (Zenodo)"
    product_id: "Jezero crater mineral map (DOI 10.5281/zenodo.5575824)"
    resolution_m: 36.0
    license: "CC BY 4.0"
    # 광물 지도의 위치를 확인하는 데 쓰는 원자료: 이 지도를 만든 CRISM 장면의 요약 파라미터(지수) 그림.
    # 번들을 만들 때마다 지도가 기준에서 얼마나 어긋났는지 재서 메타의 registration.minerals에 적는다 (pipeline/register.py).
    # 2026-11-14에 두 번 잰 값: (동 -8 m, 북 +7 m), (동 -12 m, 북 +17 m) — 한 칸(36 m)의 절반 안팎이고 측정이 10 m쯤 흔들린다.
    # 잰 값이 칸의 절반과 측정 흩어짐의 2배를 모두 넘을 때만 지도를 옮긴다(지금은 옮기지 않는다).
    index_image: "자료/crism_mtrdr_hrl000040ff/hrl000040ff_07_sr183j_mtr3.img"   # NASA PDS Geosciences, CRISM MTRDR HRL000040FF (SR), 82 MB
  geology:
    path: "자료/sim3464_database/sim3464_JezeroNili_FINAL/Geodatabase/Nili.gdb"
    layer: GeoUnits_v1
    source: "USGS (Sun & Stack 2020)"
    product_id: "SIM 3464 Geologic Map of Jezero Crater and the Nili Planum Region (DOI 10.3133/sim3464)"
    resolution_m: null              # 1:75,000 벡터
    license: "퍼블릭 도메인"
    # 지질 단위 지도는 고도 자료와 100 m쯤 어긋나 있다 — 지도의 선이 다른 바탕 그림(아래 base_image) 위에 그려졌기 때문이다.
    # 번들을 만들 때마다 그 바탕 그림을 기준 그림(reference_image)에 맞춰 보고, 구한 변환으로 폴리곤을 옮긴다.
    # 손으로 적는 이동량은 없다. 방법·결과·남은 오차는 pipeline/register.py 머리말과 번들 메타의 registration에 있다.
    base_image: "자료/sim3464_database/sim3464_JezeroNili_FINAL/Rasters/Caltech_CTX_mosaic_feb2018/Nili_CTX_Mosaic_Beta01_Feb2018_MTM.tif"

sun:
  # 태양 표를 만들 날. 그날 그 자리의 태양 고도·방위를 NASA GISS Mars24 계산 절차로 낸다 (pipeline/suntable.py).
  date_utc: "2022-01-05"            # 이 날짜 뒤에 처음 오는 지방 자정부터 하루 = Perseverance sol 313 (2022-01-05 18:55 UTC ~).
                                    # 2022년 1월 지역 먼지 폭풍이 Jezero에 닿은 날이다(Lemmon 등 2022, GRL 49, e2022GL100126):
                                    # 오전은 맑고 오전 11시쯤부터 먼지가 짙어진다. 기상 리플레이(아래 weather)와 같은 날로 맞춘다
  eva_start_lmst: "08:30"           # EVA 경과 0초에 해당하는 지방 평균 태양시. 태양 표의 t_eva_s 열이 이 시각 기준이다

# 주차점과 지점: config/placement.yaml이 있으면 그것을 쓴다(scripts/place_scenario.py가 배치 규칙으로 만든 것).
# 아래는 그 파일이 없을 때 쓰는 손 배치다.
# 기상 리플레이: 실제 화성의 하루치 기록을 번들에 넣는다 (pipeline/weather.py). 태양 표(sun)와 같은 날이어야 한다.
weather:
  sol: 313
  tau:
    path: "자료/meda_sol313/TIRStau.nom"
    source: "Smith 2022, Perseverance MEDA/TIRS aerosol retrievals, Mendeley Data V1, doi 10.17632/48phhtkcj8.1 (CC BY 4.0)"
  air_temp:
    path: "자료/meda_sol313/WE__0313___________CAL_ATS_________________P01.CSV"
    source: "NASA PDS Atmospheres Node, Mars 2020 MEDA 번들 CAL_ATS sol 313, doi 10.17189/1522849"

rover_parks:                        # 로버 주차점. 링크 지도를 이 자리에서 굽는다
  - {id: park1, lon_e: 77.451, lat_n: 18.445, note: "Perseverance 착륙 지점(Octavia E. Butler Landing)"}

pois:
  - {id: P1, name: "P1", xy: [3400, -2900], kind: feature}
  - {id: P2, name: "P2", xy: [1600, -2300], kind: sample}
  - {id: P3, name: "P3", xy: [2200, -3700], kind: feature}

# 선행 임무(Perseverance)가 이 구역 안에서 시료를 채취한 지점. 번들 메타의 samples에 실려 지도에 표시된다.
#   좌표: NASA 임무 지도(MMGIS)의 "Sampling Locations" 층 M20_SAMPLE_v3.json의 lon·lat (임무 운영 좌표, 행성 중심 위도).
#         PDS 시료 초기 보고서의 좌표, 로버 경유점 파일과 2.5 m 안에서 일치한다 (조사 2026-11-14, REFERENCE §6.1).
#   organics: 그 노두에서 유기물이 보고됐는가 — true / false / null.
#         true·false인 것만 관측 이벤트(events0.json)가 되어 과학 가치 지도를 움직인다 (pipeline/prior.py initial_events).
#         지금은 전부 null이다: 초기 보고서(2021~23)는 여러 곳에서 "방향족 유기물로 보이는 형광"을 적었지만, 뒤의 논문
#         (Bosak 등 2024 AGU Advances, Scheller 등 2024 Science Advances, Herd 등 2025 PNAS)은 같은 신호가 인산염·황산염 속
#         세륨이나 실리카 결함 같은 무기물로도 설명된다고 본다. 확인된 검출도, "없다"는 보고도 없다 — 시료를 지구에서
#         분석해야 정해진다. 그래서 "발견"으로도 "없음"으로도 넣지 않았다.
samples:
  - {id: S01, name: "Roubion (Guillaumes)", cores: ["Roubion(대기 시료만)"], lon_e: 77.45167282, lat_n: 18.4276677, lithology: "세립~중립 고철질, 화성암 추정", organics: null,
     note: "형광 신호 보고. 실리카 결함 같은 무기물 기원 가능", source: "PDS Initial Reports vol.1; Sharma 2023; Scheller 2024"}
  - {id: S02, name: "Rochette (Bellegarde)", cores: ["Montdenier", "Montagnac"], lon_e: 77.44432638, lat_n: 18.43073498, lithology: "세립 고철질, 현무암 추정", organics: null,
     note: "방향족 유기물로 보이는 형광 보고. 뒤의 분석은 인과 상관(무기물 가능)", source: "PDS Initial Reports vol.1; Sharma 2023; Scheller 2024"}
  - {id: S03, name: "Brac (Dourbes)", cores: ["Salette", "Coulettes"], lon_e: 77.44305448, lat_n: 18.43398032, lithology: "감람석 집적암", organics: null,
     note: "낮은 농도의 유기물 보고. 뒤의 분석은 인산염 속 세륨과 일치", source: "PDS Initial Reports vol.1; Scheller 2024"}
  - {id: S04, name: "Issole (Quartier)", cores: ["Robine", "Malay"], lon_e: 77.44134387, lat_n: 18.4326357, lithology: "감람석 집적암", organics: null,
     note: "황산염과 함께 유기 화합물 보고(바닥에서 가장 강한 사례). 세륨 대안 설명 있음", source: "PDS Initial Reports vol.1; Sharma 2023; Scheller 2024"}
  - {id: S05, name: "Sid (Alfalfa)", cores: ["Ha'ahóni", "Atsá"], lon_e: 77.45242176, lat_n: 18.44386406, lithology: "현무암질 안산암 추정", organics: null,
     note: "낮은 농도의 유기물 보고. 뒤의 분석은 인·실리카 상과 상관", source: "PDS Initial Reports vol.1; Sharma 2023; Scheller 2024"}
  - {id: S06, name: "Skinner Ridge (Thornton Gap)", cores: ["Swift Run", "Skyland"], lon_e: 77.40617493, lat_n: 18.45893136, lithology: "세립~중립 사암, 탄산염 포함", organics: null,
     note: "형광은 인산염·황산염 속 세륨과 더 맞는다. 삼각주 전면 시료 중 유기물 보존 가능성이 가장 낮다고 평가", source: "Bosak 2024; Herd 2025"}
  - {id: S07, name: "Wildcat Ridge (Berry Hollow)", cores: ["Hazeltop", "Bearwallow"], lon_e: 77.40588851, lat_n: 18.45863707, lithology: "황산염 포함 조립 이암", organics: null,
     note: "황산염과 묶인 형광 다수(유기물일 수 있음). 확실한 검출은 아님. 보존 가능성은 시료 중 가장 높다고 평가", source: "PDS Initial Reports vol.2; Bosak 2024; Broz 2024 LPSC; Herd 2025"}
  - {id: S08, name: "Amalik (Novarupta)", cores: ["Shuyak", "Mageik"], lon_e: 77.40144029, lat_n: 18.45072631, lithology: "감람석 포함 조립 이암", organics: null,
     note: "약한 형광. 세륨과 더 맞는다", source: "PDS Initial Reports vol.2; Bosak 2024"}
  - {id: S09, name: "Hidden Harbor (Uganik Island)", cores: ["Kukaklek"], lon_e: 77.39911421, lat_n: 18.45363597, lithology: "황산염 포함 세립 사암", organics: null,
     note: "경석고 안의 강한 형광(방향족과 일치, 무기물일 수도). 보존 가능성 높다고 평가", source: "PDS Initial Reports vol.2; Bosak 2024; Broz 2024 LPSC"}
  - {id: S10, name: "Observation Mountain", cores: ["Atmo Mountain", "Crosswind Lake"], lon_e: 77.40121811, lat_n: 18.45131442, lithology: "표토(거대 연흔)", organics: null,
     note: "라만 신호 없는 형광. 희토류·실리카 결함과 일치, 유기물 배제 못 함", source: "PDS Initial Reports vol.2; Herd 2025"}
  - {id: S11, name: "Berea (Solva)", cores: ["Melyn"], lon_e: 77.38394465, lat_n: 18.47021736, lithology: "중립 사암, 탄산염 포함, 하천", organics: null,
     note: "약한 형광(무기물 또는 방향족). 유기물의 라만 신호 없음", source: "PDS Initial Reports vol.3"}
  - {id: DEPOT, name: "Three Forks 시료 보관소", cores: ["튜브 10개(복제본)"], lon_e: 77.40823, lat_n: 18.45296, lithology: "", organics: null,
     note: "2022-12 ~ 2023-01에 튜브 10개를 내려놓은 곳(구역의 가운데)", source: "PDS mars2020_sample_depot_three_forks; NASA 2023-01-30"}
