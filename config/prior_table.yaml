# 과학 가치 바탕표 — 지질 단위 × 광물 (docs/REFERENCE_BingoTime.md §4.1, docs/spec/S3a §1 C-10e)
#
# ⚠ 전문가 검토 전 예시값이다. 문헌이 매긴 "등급의 순서"를 우리가 수치로 옮긴 것이고, 문헌에 이 수치가 있는 것이 아니다.
#
# "과학 가치"는 그 암석에 생명 흔적이 남아 있을 가능성으로 본다 (NASA 화성탐사 목표 ①, PRD §2.2).
# 이 파일에는 0~1의 수치를 손으로 적지 않는다. 적는 것은 두 가지뿐이다:
#   ① 문헌의 등급표 (McMahon et al. 2018, JGR Planets 123(5), Table 1 — 암상 × 퇴적 환경별 4단계 등급 다섯 칸)
#   ② 지질 단위·광물이 그 표의 어느 줄에 해당하는지 (우리 해석. 줄마다 근거 문헌을 적는다)
# 수치는 pipeline/prior.py가 아래 규칙으로 계산한다.
#
# 이 값은 "보정된 확률"이 아니라 0~1의 상대 지수다. McMahon의 등급 자체가 "거기 생명이 있었다면 흔적이 보존됐을 가능성"의
# 순서이고, 문헌 어디에도 이 수치는 없다. 왜 이 규칙인지와 약점은 REFERENCE §4.1 "수치로 옮기는 규칙의 근거"에 있다.
#
# 계산 규칙 (2026-11-14, 문헌 조사 뒤 정리)
#   등급 → 수치: 4단계를 0~1을 4등분한 구간의 가운데로 옮긴다 (− 0.125, + 0.375, ++ 0.625, +++ 0.875).
#                · 전문가가 매긴 순서 등급에 0~1의 값을 판단으로 주는 것은 지질 분야의 정착된 관행이다
#                  (광상 탐사의 지식 기반 퍼지 소속값 — Bonham-Carter 1994 9장. 예시 값도 0.1~0.9로 0과 1을 피한다).
#                · 화성 시료 평가도 "생명 흔적 보존 가능성"을 0~4의 정수로 매긴다 (Zorzano, Czaja 등 2025, 시료 과학 추적 행렬).
#                · 간격에 대한 정보가 없을 때 구간을 똑같이 나누고 구간 안을 고르게 보면 기대값이 가운데다.
#                · 가운데 값은 0도 1도 되지 않는다 — McMahon의 각주("−는 낮음이지 0이 아니다")와 맞는다.
#   줄의 값      = 다섯 칸(유기 세포 / 광물화된 세포 / 유기 탄소 / 분자 화석 / 미생물 퇴적 구조)의 가중 없는 평균
#                · McMahon은 다섯 종류에 순위를 매기지 않는다 → 가중치의 출처가 없다.
#                · 같은 눈금·같은 방향의 항목은 가중 없이 더해도 예측이 거의 나빠지지 않는다 (Dawes 1979).
#                · 위의 시료 추적 행렬도 점수를 가중 없이 평균한다. 여러 종류가 함께 보존되는 줄이 더 좋은 목표라는
#                  생명 탐지의 원칙(여러 증거가 겹쳐야 한다 — Neveu 등 2018)과도 맞는다.
#   줄의 분산    = 다섯 칸의 분산 + 구간 폭² / 12   (뒤 항: 등급 하나가 구간 안의 어디인지 모른다는 불확실성)
#   mu  = rows에 적은 줄들의 값의 평균
#   var = rows 줄들의 분산의 평균 + rows 줄 값들 사이의 분산          (암상을 모를 때: 두 줄을 반반으로 섞은 것 — Hoeting 등 1999의 식)
#         + (alt가 있으면) 0.5 × (mu − alt 줄들의 값의 평균)²
#         마지막 항: 기원에 다른 해석(alt)이 맞서면 값은 주된 해석에 두고 분산을 키운다 (REFERENCE §4.1 원칙 ④).
#         주된 값에서 벗어날 수 있는 정도(평균 제곱 편차) = p × 차이², 다른 해석이 맞을 확률 p는 모르므로 0.5로 둔다.
#
# 숨기지 않는 약점
#   · 순서 등급의 평균은 수치를 어떻게 매기느냐에 따라 줄의 순위가 바뀔 수 있다 (Stevens 1946, Jamieson 2004).
#   · 평균은 "어느 한 종류라도 보존될 가능성"보다 낮게 나온다. 그 뜻으로는 다섯 칸의 최댓값이 더 가깝다 — 평균을 쓴 것은 선택이다.
#   · 등급표의 꼬리표(지구 기록에 사례 없음 X, 10억 년보다 오래된 사례 없음 <)는 반영하지 않았다.
#   · 다섯 종류는 서로 독립이 아니다(세포 둘, 유기물 둘). 가중 없는 평균은 미생물 퇴적 구조에 20 %만 준다.
#   표에 없는 단위        → 값 없음 (지도에 "근거 없음"으로 보인다. 보존 가능성을 말한 문헌을 찾지 못했다)
#   표에 없는 (단위, 광물) → 그 단위의 값만 쓴다 (원칙 ⑤)
version: 1
status: "전문가 검토 전 예시값. 보정된 확률이 아니라 문헌의 순서 등급을 옮긴 상대 지수"

grade_scale: {"-": 0.125, "+": 0.375, "++": 0.625, "+++": 0.875}

# McMahon 2018 Table 1 (p. 1015)에서 쓰는 줄. 등급은 REFERENCE §4.1에 옮겨 적고 원문과 대조한 것이다(2026-11-12).
rows:
  fluvial_sandstone:  {grades: ["-", "++", "-", "-", "-"],         label: "쇄설성 사암·실트암, 하천"}
  fluvial_mudstone:   {grades: ["+", "+", "++", "++", "-"],        label: "쇄설성 점토암, 하천"}
  delta_sandstone:    {grades: ["-", "+++", "+", "+", "+++"],      label: "쇄설성 사암·실트암, 삼각주 말단·호수"}
  delta_mudstone:     {grades: ["++", "++", "+++", "+++", "+++"],  label: "쇄설성 점토암, 삼각주 말단·호수"}
  lake_carbonate:     {grades: ["-", "+", "-", "-", "+++"],        label: "층상·자생 탄산염, 삼각주 말단·호수"}
  groundwater_clay:   {grades: ["-", "-", "-", "-", "-"],          label: "자생 점토, 지하수"}
  pore_secondary:     {grades: ["++", "++", "++", "+", "-"],       label: "그 밖의 공극·맥 충전 2차 광물, 지하수"}

# 지질 단위 (USGS SIM 3464의 기호)
units:
  NHjf2: &fan
    rows: [delta_sandstone, delta_mudstone]
    source: "SIM 3464 p. 2, 10: 삼각주 또는 호수 퇴적. 이 지도는 삼각주를 한 단위로 묶어 세립부와 조립부를 가르지 않으므로 두 암상을 반반으로 본다"
  NHjf1: *fan
  Nle: &etched
    rows: [pore_secondary]
    source: "SIM 3464 p. 8–9: 화산재 낙하 퇴적, 감람석 + 탄산염. Horgan 2020 p. 12: 호수 퇴적은 아닐 것. McMahon 2018 p. 1017: 감람석과 함께 나오는 Mg-탄산염은 열수 변질 추정. Farley 2022 p. 15: 2차 광물에 조건부 가능성"
  Nue: *etched
  Njf: &mafic
    rows: [groundwater_clay]
    alt: [pore_secondary]
    source: "Farley 2022 p. 14: 거의 변질되지 않은 화성암, 점토 드묾. McMahon 2018 Table 1: 지하수의 자생 점토는 전부 낮음. 다른 해석: 빈틈의 염류에 조건부 가능성(Farley 2022 p. 15)"
  Nnp2: *mafic
  Nnp1: &basement
    rows: [groundwater_clay]
    alt: [pore_secondary]
    source: "SIM 3464 p. 3, 8: 노아키스 기반암, 지하에서 거주 가능했던 환경으로 해석. Hays 2017 §3.4.3: 지하의 보존은 알려지지 않음. McMahon 2018 Table 1: 자생 점토는 전부 낮음"
  cr: *basement
  Hnpf:
    rows: [fluvial_sandstone, fluvial_mudstone]
    source: "SIM 3464 p. 10: 수로 활동 말기의 충적·하천 퇴적. 암상을 가르지 않으므로 두 암상을 반반으로 본다"
  # 값이 없는 단위: Nrb(기원 불확실), su·Aeb(덮개 퇴적물·바람 지형), ce·ci(충돌구 분출물·내부).
  # SIM 3464 팸플릿은 이 단위들의 퇴적 환경을 등급표의 줄에 댈 만큼 말하지 않는다.

# 광물로 조정하는 칸. 같은 광물이라도 단위가 다르면 다른 줄에 댄다 (원칙 ②).
# 광물 이름은 Parente 2021 지도의 분류 10종 가운데 문헌 근거가 있는 여섯만 쓴다 (REFERENCE §4.1, 2026-11-12 결정).
cells:
  NHjf2: &fan_cells
    fe_mg_smectite: &fan_clay
      rows: [delta_mudstone]
      alt: [fluvial_mudstone]
      source: "McMahon 2018 Table 1과 결론(철이 많은 호수 점토암을 우선). Broz 2024, Hurowitz 2025, Herd 2025. 다른 해석: Horgan 2020 p. 7, 18 — 삼각주의 스멕타이트는 역전 하도·절개곡(하천) 부분에 있다"
    mg_smectite_2: *fan_clay
    olivine: &fan_pointbar
      rows: [fluvial_sandstone]
      alt: [delta_sandstone]
      source: "SIM 3464 p. 2, 10과 Horgan 2020 p. 7, 18: 삼각주의 감람석·탄산염은 포인트바(하천) 퇴적물에 있다. Tarnas 2021 §6: 삼각주의 탄산염은 대부분 쇄설성. 다른 해석: 수중 수로 제방(Stack 2020)"
    mg_carbonate: *fan_pointbar
    lcp:
      rows: [fluvial_sandstone]
      alt: [delta_sandstone]
      source: "Horgan 2020 p. 7, 18: 역전 하도·절개곡 부분은 저칼슘 휘석 + Fe/Mg 스멕타이트"
  NHjf1: *fan_cells
  Nue:
    mg_carbonate:
      rows: [pore_secondary]
      alt: [lake_carbonate]
      source: "가장자리 탄산염. Tarnas 2021 §6: 감람석 단위의 열수 탄산염화가 가장 유력. 다른 해석: 호숫가 자생 침전(Horgan 2020 p. 13, 31)"
