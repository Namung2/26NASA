# 물리·안전·모델 파라미터 (docs/spec/S4_tier_config.md §2, §3)
#
# 모든 항목은 {value, unit, status, source} 꼴이다.
#   status: REF = 문헌에 출처가 있는 수치 / DESIGN = 설계 문서가 정한 값 / TBD = 문헌에서 뽑아야 하는 값(placeholder로만 실행)
#           TUNE = 출처 없는 제안 초기값. 데모를 돌려 보며 고친다 — 문헌 수치가 아니다
# 코어는 이 파일을 읽지 않는다. host/config.py가 읽어 숫자 구조체(bt_config)로 만들어 넘긴다.
version: 1

suit:
  eva_max_h:        {value: 8,    unit: h,   status: REF, source: "xEVA ConOps EVA-EXP-0042 Rev B (6±2 h, max 8) — REFERENCE §2.1"}

mobility:
  v_plan_kmh:       {value: 2.0,  unit: km/h, status: REF, source: "xEVA ConOps — REFERENCE §2.1"}
  v_return_kmh:     {value: 2.7,  unit: km/h, status: REF, source: "ALSJ Apollo 17 editor's assumption — REFERENCE §3.1"}
  slope_model:      {value: apollo_linear_steep_down, status: DESIGN, source: "θ ≥ −10°: v = 0.75 − 0.01·θ m/s (NASA ICES-2025-129 eq. 2). θ < −10°: 9.5 % slower per degree (SEXTANT speed table). The formula is in core/src/mobility.cpp"}
  theta_max_deg:    {value: 20,   unit: deg, status: REF, source: "NASA Artemis EVA test requirement (walking on a 20° slope); ±20° keep-out in NASA ICES-2025-129 — REFERENCE §4"}

radiation:
  dose_rate_mSv_day: {value: 0.67, unit: mSv/day, status: REF, source: "Hassler et al. Science 2013/14 (Curiosity RAD) — REFERENCE §4"}
  spe_multiplier:    {value: null, placeholder: 10, status: TBD, source: "SCENARIOS §2.2 'multiplier setting' — no value given"}

nav:
  sigma_warn_m:     {value: 50,   unit: m, status: DESIGN, source: "The screen warns when the position error radius exceeds this"}

decision:
  obs_to_dp_max_min: {value: 2,    unit: min, status: DESIGN, source: "SCENARIOS §2.3 / §3.3"}
  metrics_tolerance: {value: 0.05, status: DESIGN, source: "SCENARIOS §3.3"}
  eps_fork:          {value: 0.10, status: TUNE, source: "Relative cost difference that triggers a route fork"}
  cooldown_s:        {value: 120,  unit: s,   status: TUNE, source: "Interval during which a decision point with the same (kind, cause) is not raised again"}
  stay_max_min:      {value: 20,   unit: min, status: TUNE, source: "Length of the stay option"}
  stay_buffer_min:   {value: 2,    unit: min, status: TUNE, source: "Departure-limit margin the stay option leaves"}
  hyp_snap_m:        {value: 50,   unit: m,   status: TUNE, source: "Search radius for a hypothesis target"}
  # time_min 0.1666667 = 10초. 걷는 시간은 "약 N분 M초"로 적는다(2026-11-14 결정). 10초 단위는 제안값이다
  display_precision: {value: {time_min: 0.1666667, max_slope_deg: 1, dose_uSv: 0.1, value: 0.1, value_var: 0.01, info_gain: 0.1, nlt_margin_min: 1, comm_loss_min: 1},
                      status: DESIGN, source: "S4 §5 — numbers that look the same on screen are the same value in the computation"}

bundle:
  field_limit_mb:   {value: 50,   unit: MB, status: DESIGN, source: "PRD §7.3"}
  aoi_radius_max_m: {value: 5000, unit: m,  status: DESIGN, source: "PRD R-01"}

placement:
  work_radius_m:    {value: 2000, unit: m,  status: REF,    source: "xEVA ConOps walking range '~2 km from the lander' — REFERENCE §2.1"}
  max_from_rover_m: {value: 3500, unit: m,  status: REF,    source: "NASA ICES-2026-127 — REFERENCE §4"}
  rover_standoff_m: {value: 2000, unit: m,  status: DESIGN, source: "SCENARIOS §3.1"}
  poi_min_sep_m:    {value: 300,  unit: m,  status: TUNE,   source: "Minimum spacing between POIs"}
  p2_clear_radius_m: {value: 200, unit: m,  status: TUNE,   source: "Radius used to check the passable fraction around the discovery point"}
  hyp_probe_m:      {value: 300,  unit: m,  status: TUNE,   source: "Distance examined when choosing the hypothesis direction"}

planner:
  eps_schedule:     {value: [3.0, 1.5, 1.0], status: TUNE, source: "Weighted A* ε schedule"}
  snap_max_m:       {value: 20,   unit: m, status: TUNE, source: "Snap limit for an impassable start or goal"}
  alt_overlap_max:  {value: 0.8,  status: TUNE, source: "Overlap ratio above which an alternative route counts as the same route"}
  corridor_m:       {value: 100,  unit: m, status: TUNE, source: "Width around the coarse-grid route that is re-solved on the fine grid"}

cost:
  profiles:                         # 간선 비용의 가중 (경사, 거칠기, 그림자, 방사선) — SYSTEM §3.1
    balanced:       {value: [1.0, 0.5, 0.3, 0.1], status: TUNE, source: "Profile 0"}
    fastest:        {value: [1.0, 0.0, 0.0, 0.0], status: TUNE, source: "Profile 1 — for alternative routes"}
    gentle:         {value: [2.0, 1.0, 0.3, 0.1], status: TUNE, source: "Profile 2 — for alternative routes"}
  rough_ref_m:      {value: 0.5,  unit: m, status: TUNE, source: "Roughness normalisation reference"}
  dose_ref:         {value: 27.9, unit: uSv/h, status: DESIGN, source: "radiation.dose_rate_mSv_day 0.67 converted to an hourly rate — nominal conditions = 1"}

terrain:
  roughness_win_m:   {value: 15,   unit: m, status: TUNE, source: "Roughness window"}
  shadow_bins:       {value: 8,    status: TUNE, source: "Number of shadow time bins"}
  horizon_max_m:     {value: 2000, unit: m, status: TUNE, source: "Maximum distance searched for terrain that casts a shadow"}

science:
  l0_m:                   {value: 50,     unit: m, status: TUNE, source: "Length scale over which an observation spreads"}
  aniso_ratio:            {value: 4,      status: TUNE, source: "Strata continuity long axis / short axis"}
  exposure_slope_ref_deg: {value: 20,     unit: deg, status: TUNE, source: "Slope weighting reference for erosion exposure"}
  obs_noise:              {value: 0.05,   status: TUNE, source: "Observation noise variance"}
  unconfirmed_factor:     {value: 4,      status: TUNE, source: "Noise multiplier for an unconfirmed observation"}
  tau_s:                  {value: 1800,   unit: s, status: DESIGN, source: "How long an attention trace stays alive — derived from about 30 min of work at one site (REFERENCE §3.2, §4.3)"}
  trace_bucket_s:         {value: 60,     unit: s, status: TUNE, source: "Time window that batches map recomputation (host)"}
  r_obs_m:                {value: 20,     unit: m, status: TUNE, source: "Radius observable from the route"}
  w_transit:              {value: 0.25,   status: TUNE, source: "Observation weight for transit segments"}
  A_ref_m2:               {value: 400,    unit: m2, status: TUNE, source: "Reference area for value normalisation"}
  r_plan:                 {value: 0.05,   status: TUNE, source: "Assumed noise for the information-gain computation"}
  touch_eps:              {value: 0.05,   status: TUNE, source: "Lower bound of kernel weight for a cell to count as touched by an observation"}
  var_floor:              {value: 0.0001, status: TUNE, source: "Lower bound of variance after an observation update"}
  default_res_m:          {value: 20,     unit: m, status: TUNE, source: "Science grid used when there is no mineral raster"}

env:
  dust_tau_warn:    {value: 0.414, status: DESIGN, source: "Dust optical depth warning (9 µm infrared value). 95 % of the measured record at Jezero (Smith 2022, sols 15–400, 56,368 points at 5-minute spacing) lies below this value — recomputed when the bundle is built and written to env.tau_p95_record in the metadata. The 95 % criterion is our choice. It is not a threshold for visible-band tau (REFERENCE §6.2)"}
  dust_hold_s:      {value: 300, unit: s, status: DESIGN, source: "Dust must stay above the threshold this long before it counts as crossed and a decision point is raised. This is the measurement spacing of the record (Smith 2022, median 4.99 min) — a single noisy measurement does not ask; two consecutive measurements above the threshold do. The on-screen warning does not wait"}

safety:
  dose_warn_uSv:     {value: null, unit: uSv, status: TBD, source: "Left empty until a sourced value is found — when empty, dose is displayed only"}
  k_return:          {value: 1.0,  status: TUNE, source: "Safety factor on return time"}
  nlt_warn_min:      {value: 20,   unit: min, status: DESIGN, source: "Apollo 17's first warning came 20 min before the departure limit — REFERENCE §3.1"}
  nlt_force_min:     {value: 7,    unit: min, status: DESIGN, source: "Apollo 17's last call, '7 minutes' — REFERENCE §3.1"}
  sunset_margin_min: {value: 30,   unit: min, status: TUNE, source: "Return margin before sunset"}
  sunset_warn_min:   {value: 60,   unit: min, status: TUNE, source: "Sunset warning"}

link:
  # 로버 ↔ 우주복 UHF 링크가 되는 곳을 번들에 구워 둘 때 쓰는 값 (pipeline/terrain.py link_mask, 근거: REFERENCE §4.4).
  # 화성 선외활동용 우주복 무선기의 공개된 제원이 없어서 달 탐사 자료의 값을 빌렸다 — 빌린 값이라는 것을 숨기지 않는다.
  radio:
    freq_mhz:          {value: 401,   unit: MHz, status: DESIGN, source: "Assumption. xEVA ConOps says only 'UHF'. 401 MHz is the frequency Foore & Ida 2007 (NASA/TM-2007-214825) analysed for lunar-surface UHF, and Perseverance's UHF antenna is also about 400 MHz"}
    antenna_rover_h_m: {value: 3.0,   unit: m,   status: REF,    source: "Rover antenna height 3 m in Foore & Ida 2007. NASA SEV (pressurised rover concept) is 10 ft = 3.05 m tall (NASA SEV fact sheet). With a mast, 6–10 m (Hwu et al. 2008, LSR-M 2023)"}
    antenna_suit_h_m:  {value: 2.0,   unit: m,   status: REF,    source: "Astronaut antenna height 2 m as used by Foore & Ida 2007, Hwu et al. 2008 and Nokia 2024. Apollo used 1.83 m (MSC-05161 Suppl. 6 p. 1-3)"}
    loss_allow_db:     {value: 126.8, unit: dB,  status: REF,    source: "Borrowed value: the measured limit of the Apollo 15 suit-to-lander VHF link. Transmit +25.7 dBm, suit antenna −2.0 dB, cable −1.9 dB, receive threshold −105 dBm → 25.7 − 2.0 − 1.9 + 105 = 126.8 dB (NASA MSC-05161 Suppl. 6, 1972, pp. 2-7, 2-13)"}
    fade_margin_db:    {value: 9.77,  unit: dB,  status: REF,    source: "Foore & Ida 2007 Table I, 401 MHz rover (3 m) → astronaut (2 m): mean 3.25 dB + 2 × standard deviation 3.26 dB. Using twice the standard deviation (about 95 %) is our choice. Close to the 10 dB shadowing margin in Nokia 2024"}
  hb_hz:            {value: 1,    unit: Hz, status: DESIGN, source: "SYSTEM §3.9"}
  sync_batch:       {value: 16,   status: TUNE, source: "Number of events carried in one sync message (host)"}
  path_max_pts:     {value: 32,   status: TUNE, source: "Maximum number of points per option path when a decision point is sent over UHF (host)"}
  wifi_range_m:     {value: 300,  unit: m, status: TUNE, source: "Distance to the rover within which the simulator treats Wi-Fi as available — assumption (host)"}
  lost_dp_s:        {value: 120,  unit: s,  status: TUNE, source: "Options are paused when UHF loss lasts this long"}
  uhf:  &channel
    timeout_ms:     {value: 500,  unit: ms, status: TUNE, source: "Heartbeat reply timeout"}
    n_down:         {value: 5,    status: TUNE, source: "Number of consecutive missed replies — same scheme as RFC 5880; the count is a proposed value"}
    n_up:           {value: 3,    status: TUNE, source: "Number of consecutive replies needed to declare recovery"}
    ewma_alpha:     {value: 0.3,  status: TUNE, source: "Moving average of the loss rate"}
    loss_down:      {value: 0.85, status: TUNE, source: "Loss-rate threshold — set so it does not fire before five consecutive misses (0.83)"}
    rtt_down_ms:    {value: 400,  unit: ms, status: TUNE, source: "Threshold on the mean round-trip time"}
  wifi: *channel

# 화면 메뉴의 단계 → 값 (호스트만 쓴다. 코어에는 고른 값이 들어간다)
menu:
  extent_levels_m:    {value: [100, 300, 1000], unit: m, status: TUNE, source: "Three extent levels in the hypothesis menu"}
  confidence_levels:  {value: [0.17, 0.5, 0.83], status: DESIGN, source: "Three confidence levels in the hypothesis menu (unlikely / about as likely as not / likely). Midpoints of the IPCC likelihood-scale ranges (0–33 / 33–66 / 66–100 %) — REFERENCE §4.3"}
  mark_radius_levels_m: {value: [10, 30, 100], unit: m, status: TUNE, source: "Three radius levels for a blocked mark"}
  arrive_radius_m:    {value: 10, unit: m, status: TUNE, source: "Distance at which a stop counts as reached (when the host removes passed stops from the plan)"}
  note_max_chars:     {value: 200, status: TUNE, source: "Maximum characters in one free-text note"}
  trace_snapshot_max: {value: 64, status: TUNE, source: "Maximum number of attention traces sent to the screen"}
