# 지역 설정(jezero_inlet: 삼각주 위쪽과 서쪽 유입 계곡(Neretva Vallis)) — config/site.yaml에서 구역의 중심만 바꾼 것. 다른 구역에서도 파이프라인·코어·시나리오가 도는지 보는 용도
# 지역 설정 — 번들을 만들 때의 입력 (docs/spec/S3a §1, S5 §8). 당일(2026-11-14) 작성.
#
# 좌표 약속
#   로컬 좌표: 미터, (동쪽 x, 북쪽 y). 원점 (0, 0) = 활동 구역의 북서쪽 모서리 → 구역 안의 y는 0 ~ -(한 변)이다.
#   로컬 투영: 구역 중심을 기준 위도·경도로 한 정거원통 (Mars 2000 구, 반지름 3,396,190 m).
#   받은 고도 자료는 기준 위도가 0°라 동서가 5 % 늘어나 있다 → 반드시 이 투영으로 다시 놓는다 (pipeline/dtm.py).
site: jezero_inlet
bundle_version: 1

aoi:
  center_lon_e: 77.33               # 삼각주 위쪽과 서쪽 유입 계곡(Neretva Vallis)
  center_lat_n: 18.48
  half_size_m: 2500                 # 5 km 정사각형. 고도 자료가 100 % 있는 구역 (2026-11-14 확인)

levels_m: {field: 5, rover: 2}      # 기기용 / 로버용 격자

products:                           # 받은 원천 자료. 받는 곳과 내용은 docs/REFERENCE_BingoTime.md §1.2, §6.1
  dtm:
    path: "자료/m2020_trn_hirise/JEZ_hirise_soc_006_DTM_MOLAtopography_DeltaGeoid_1m_Eqc_latTs0_lon0_blend40.tif"
    source: "USGS Astrogeology"
    product_id: "Mars 2020 Terrain Relative Navigation HiRISE DTM Mosaic (DOI 10.5066/P9REJ9JN)"
    resolution_m: 1.0
    license: "USGS public data (public domain)"
  # 기준 그림: 고도 자료와 한 벌로 나온 CTX 정사 모자이크. 다른 바탕 위에 만들어진 자료(지질 단위)를 여기에 맞춘다
  reference_image:
    path: "자료/m2020_trn_ctx/JEZ_ctx_B_soc_008_orthoMosaic_6m_Eqc_latTs0_lon0.tif"
    source: "USGS Astrogeology"
    product_id: "Mars 2020 TRN CTX Orthomosaic (DOI 10.5066/P9GV1ND3)"
    resolution_m: 6.0
    license: "USGS public data (public domain)"
  minerals:
    path: "자료/mineral_parente2021/jezeroFinal.tif"
    source: "Parente, Itoh, Saranathan 2021 (Zenodo)"
    product_id: "Jezero crater mineral map (DOI 10.5281/zenodo.5575824)"
    resolution_m: 36.0
    license: "CC BY 4.0"
    # 광물 지도의 위치를 확인하는 데 쓰는 원자료: 이 지도를 만든 CRISM 장면의 요약 파라미터(지수) 그림.
    # 번들을 만들 때마다 지도가 기준에서 얼마나 어긋났는지 재서 메타의 registration.minerals에 적는다 (pipeline/register.py).
    # 2026-11-14에 두 번 잰 값: (동 -8 m, 북 +7 m), (동 -12 m, 북 +17 m) — 한 칸(36 m)의 절반 안팎이고 측정이 10 m쯤 흔들린다.
    # 잰 값이 칸의 절반과 측정 흩어짐의 2배를 모두 넘을 때만 지도를 옮긴다(지금은 옮기지 않는다).
    index_image: "자료/crism_mtrdr_hrl000040ff/hrl000040ff_07_sr183j_mtr3.img"   # NASA PDS Geosciences, CRISM MTRDR HRL000040FF (SR), 82 MB
  geology:
    path: "자료/sim3464_database/sim3464_JezeroNili_FINAL/Geodatabase/Nili.gdb"
    layer: GeoUnits_v1
    source: "USGS (Sun & Stack 2020)"
    product_id: "SIM 3464 Geologic Map of Jezero Crater and the Nili Planum Region (DOI 10.3133/sim3464)"
    resolution_m: null              # 1:75,000 벡터
    license: "Public domain"
    # 지질 단위 지도는 고도 자료와 100 m쯤 어긋나 있다 — 지도의 선이 다른 바탕 그림(아래 base_image) 위에 그려졌기 때문이다.
    # 번들을 만들 때마다 그 바탕 그림을 기준 그림(reference_image)에 맞춰 보고, 구한 변환으로 폴리곤을 옮긴다.
    # 손으로 적는 이동량은 없다. 방법·결과·남은 오차는 pipeline/register.py 머리말과 번들 메타의 registration에 있다.
    base_image: "자료/sim3464_database/sim3464_JezeroNili_FINAL/Rasters/Caltech_CTX_mosaic_feb2018/Nili_CTX_Mosaic_Beta01_Feb2018_MTM.tif"

sun:
  # 태양 표를 만들 날. 그날 그 자리의 태양 고도·방위를 NASA GISS Mars24 계산 절차로 낸다 (pipeline/suntable.py).
  date_utc: "2022-01-05"            # 이 날짜 뒤에 처음 오는 지방 자정부터 하루 = Perseverance sol 313 (2022-01-05 18:55 UTC ~).
                                    # 2022년 1월 지역 먼지 폭풍이 Jezero에 닿은 날이다(Lemmon 등 2022, GRL 49, e2022GL100126):
                                    # 오전은 맑고 오전 11시쯤부터 먼지가 짙어진다. 기상 리플레이(아래 weather)와 같은 날로 맞춘다
  eva_start_lmst: "08:30"           # EVA 경과 0초에 해당하는 지방 평균 태양시. 태양 표의 t_eva_s 열이 이 시각 기준이다

# 주차점과 지점: config/placement.yaml이 있으면 그것을 쓴다(scripts/place_scenario.py가 배치 규칙으로 만든 것).
# 아래는 그 파일이 없을 때 쓰는 손 배치다.
# 기상 리플레이: 실제 화성의 하루치 기록을 번들에 넣는다 (pipeline/weather.py). 태양 표(sun)와 같은 날이어야 한다.
weather:
  sol: 313
  tau:
    path: "자료/meda_sol313/TIRStau.nom"
    source: "Smith 2022, Perseverance MEDA/TIRS aerosol retrievals, Mendeley Data V1, doi 10.17632/48phhtkcj8.1 (CC BY 4.0)"
  air_temp:
    path: "자료/meda_sol313/WE__0313___________CAL_ATS_________________P01.CSV"
    source: "NASA PDS Atmospheres Node, Mars 2020 MEDA bundle CAL_ATS sol 313, doi 10.17189/1522849"

rover_parks:                        # 로버 주차점. 링크 지도를 이 자리에서 굽는다
  - {id: park1, lon_e: 77.33, lat_n: 18.48, note: "Centre of the area (replaced by placement.yaml)"}

pois:
  - {id: P1, name: "P1", xy: [3400, -2900], kind: feature}
  - {id: P2, name: "P2", xy: [1600, -2300], kind: sample}
  - {id: P3, name: "P3", xy: [2200, -3700], kind: feature}

# 선행 임무(Perseverance)가 이 구역 안에서 시료를 채취한 지점. 번들 메타의 samples에 실려 지도에 표시된다.
#   좌표: NASA 임무 지도(MMGIS)의 "Sampling Locations" 층 M20_SAMPLE_v3.json의 lon·lat (임무 운영 좌표, 행성 중심 위도).
#         PDS 시료 초기 보고서의 좌표, 로버 경유점 파일과 2.5 m 안에서 일치한다 (조사 2026-11-14, REFERENCE §6.1).
#   organics: 그 노두에서 유기물이 보고됐는가 — true / false / null.
#         true·false인 것만 관측 이벤트(events0.json)가 되어 과학 가치 지도를 움직인다 (pipeline/prior.py initial_events).
#         지금은 전부 null이다: 초기 보고서(2021~23)는 여러 곳에서 "방향족 유기물로 보이는 형광"을 적었지만, 뒤의 논문
#         (Bosak 등 2024 AGU Advances, Scheller 등 2024 Science Advances, Herd 등 2025 PNAS)은 같은 신호가 인산염·황산염 속
#         세륨이나 실리카 결함 같은 무기물로도 설명된다고 본다. 확인된 검출도, "없다"는 보고도 없다 — 시료를 지구에서
#         분석해야 정해진다. 그래서 "발견"으로도 "없음"으로도 넣지 않았다.
samples:
  - {id: S01, name: "Roubion (Guillaumes)", cores: ["Roubion (atmospheric sample only)"], lon_e: 77.45167282, lat_n: 18.4276677, lithology: "Fine- to medium-grained mafic, inferred igneous", organics: null,
     note: "Fluorescence signal reported. May be of inorganic origin such as silica defects", source: "PDS Initial Reports vol.1; Sharma 2023; Scheller 2024"}
  - {id: S02, name: "Rochette (Bellegarde)", cores: ["Montdenier", "Montagnac"], lon_e: 77.44432638, lat_n: 18.43073498, lithology: "Fine-grained mafic, inferred basalt", organics: null,
     note: "Fluorescence resembling aromatic organics reported. Later analysis found a correlation with phosphorus (possibly inorganic)", source: "PDS Initial Reports vol.1; Sharma 2023; Scheller 2024"}
  - {id: S03, name: "Brac (Dourbes)", cores: ["Salette", "Coulettes"], lon_e: 77.44305448, lat_n: 18.43398032, lithology: "Olivine cumulate", organics: null,
     note: "Low-concentration organics reported. Later analysis is consistent with cerium in phosphate", source: "PDS Initial Reports vol.1; Scheller 2024"}
  - {id: S04, name: "Issole (Quartier)", cores: ["Robine", "Malay"], lon_e: 77.44134387, lat_n: 18.4326357, lithology: "Olivine cumulate", organics: null,
     note: "Organic compounds reported together with sulfate (the strongest case on the crater floor). A cerium alternative explanation exists", source: "PDS Initial Reports vol.1; Sharma 2023; Scheller 2024"}
  - {id: S05, name: "Sid (Alfalfa)", cores: ["Ha'ahóni", "Atsá"], lon_e: 77.45242176, lat_n: 18.44386406, lithology: "Inferred basaltic andesite", organics: null,
     note: "Low-concentration organics reported. Later analysis found a correlation with phosphorus and silica phases", source: "PDS Initial Reports vol.1; Sharma 2023; Scheller 2024"}
  - {id: S06, name: "Skinner Ridge (Thornton Gap)", cores: ["Swift Run", "Skyland"], lon_e: 77.40617493, lat_n: 18.45893136, lithology: "Fine- to medium-grained sandstone, carbonate-bearing", organics: null,
     note: "The fluorescence fits cerium in phosphate and sulfate better. Rated the lowest organic preservation potential among the delta-front samples", source: "Bosak 2024; Herd 2025"}
  - {id: S07, name: "Wildcat Ridge (Berry Hollow)", cores: ["Hazeltop", "Bearwallow"], lon_e: 77.40588851, lat_n: 18.45863707, lithology: "Sulfate-bearing coarse mudstone", organics: null,
     note: "Many fluorescence detections associated with sulfate (may be organic). Not a definitive detection. Rated the highest preservation potential among the samples", source: "PDS Initial Reports vol.2; Bosak 2024; Broz 2024 LPSC; Herd 2025"}
  - {id: S08, name: "Amalik (Novarupta)", cores: ["Shuyak", "Mageik"], lon_e: 77.40144029, lat_n: 18.45072631, lithology: "Olivine-bearing coarse mudstone", organics: null,
     note: "Weak fluorescence. Fits cerium better", source: "PDS Initial Reports vol.2; Bosak 2024"}
  - {id: S09, name: "Hidden Harbor (Uganik Island)", cores: ["Kukaklek"], lon_e: 77.39911421, lat_n: 18.45363597, lithology: "Sulfate-bearing fine-grained sandstone", organics: null,
     note: "Strong fluorescence within anhydrite (consistent with aromatics, possibly inorganic). Rated high preservation potential", source: "PDS Initial Reports vol.2; Bosak 2024; Broz 2024 LPSC"}
  - {id: S10, name: "Observation Mountain", cores: ["Atmo Mountain", "Crosswind Lake"], lon_e: 77.40121811, lat_n: 18.45131442, lithology: "Regolith (megaripple)", organics: null,
     note: "Fluorescence without a Raman signal. Consistent with rare-earth elements or silica defects; organics cannot be ruled out", source: "PDS Initial Reports vol.2; Herd 2025"}
  - {id: S11, name: "Berea (Solva)", cores: ["Melyn"], lon_e: 77.38394465, lat_n: 18.47021736, lithology: "Medium-grained sandstone, carbonate-bearing, fluvial", organics: null,
     note: "Weak fluorescence (inorganic or aromatic). No Raman signal of organics", source: "PDS Initial Reports vol.3"}
  - {id: DEPOT, name: "Three Forks sample depot", cores: ["10 tubes (duplicates)"], lon_e: 77.40823, lat_n: 18.45296, lithology: "", organics: null,
     note: "Where 10 tubes were set down in 2022-12 to 2023-01 (centre of the area)", source: "PDS mars2020_sample_depot_three_forks; NASA 2023-01-30"}
